# Uygulama veritabanı (şablonlar, export geçmişi, yerel hesap). Şifre: rapor-merkezi-db Secret'ı (key: password).
apiVersion: v1
kind: Service
metadata:
  name: rapor-merkezi-db
  labels: {app.kubernetes.io/name: rapor-merkezi-db}
spec:
  selector: {app.kubernetes.io/name: rapor-merkezi-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rapor-merkezi-db
  labels: {app.kubernetes.io/name: rapor-merkezi-db}
spec:
  serviceName: rapor-merkezi-db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rapor-merkezi-db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rapor-merkezi-db}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # postgres (alpine imajı)
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:16.14-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: rapor}
            - {name: POSTGRES_USER, value: rapor}
            - {name: POSTGRES_PASSWORD_FILE, value: /secrets/password}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256"}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, rapor, -d, rapor]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, rapor, -d, rapor]}
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: rapor-merkezi-db, defaultMode: 0440}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
